# Builds the Pawse Android APK on GitHub's servers and attaches it, with its build info, to the run.
#
# - Every pull request and every push to main: lint, typecheck, tests, web build, debug (test) APK.
# - Actions → "Android APK" → Run workflow: choose debug, release or release-unsigned.
#   release: needs the release key in the ANDROID_RELEASE_BUNDLE repository secret (see
#   apps/web/android/keystore/README.md). It refuses to run without it and checks the certificate,
#   so it can never sign with any other key.
#   release-unsigned: the same release build without a signature, for signing elsewhere with the key.
#   It can't be installed or published as it is.
#   publish (release only, on main): tick "publish" and write the release notes. The publish job takes the
#   verified APK from the apk job, runs .github/scripts/publish-release.py and pushes to
#   jithujsam/pawse-releases main. Pushing to main publishes at once (standing owner approval, docs/RELEASING.md).
#   Needs the PAWSE_RELEASES_TOKEN secret: a fine-grained token with contents write on jithujsam/pawse-releases only.
name: Android APK

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug (test app, installs next to the real one), release (signed with the release key) or release-unsigned (to sign elsewhere)"
        type: choice
        options: [debug, release, release-unsigned]
        default: debug
      publish:
        description: "release, from main only: also publish the APK to jithujsam/pawse-releases main (live at once)"
        type: boolean
        default: false
      release_notes:
        description: "publish only: one line of plain-language notes for users (shown in the app and the README)"
        type: string
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # The release certificate (apps/web/android/keystore/README.md). A release build signed with anything else fails.
  RELEASE_CERT_SHA256: 10ab3feb74724e2e38161c8027e679438a89d3521525980fbbd796ad62faa9f8

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.verify.outputs.artifact }}
    steps:
      # On a PR, build exactly the PR's latest commit (not GitHub's temporary merge commit).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and its downloaded dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4
      # Keep the test-build signing key between runs, so a newer "Pawse Test" installs over an older one
      # instead of needing the test app removed first. Only debug builds use it; it never signs a release.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pawse-debug-keystore-v1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        run: |
          set -o pipefail
          pnpm lint
          pnpm typecheck
          pnpm test 2>&1 | tee test-output.txt
          # Strip colour codes before reading the totals.
          sed -E 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -E "Tests +[0-9]+ passed" | sed -E 's/.*Tests +//' > test-summary.txt
          [ -s test-summary.txt ] || { echo "::error::Couldn't read the test totals"; exit 1; }

      - name: Build the web app
        run: pnpm --filter web build

      - name: Sync the Android project
        working-directory: apps/web
        run: npx cap sync android

      - name: Put the release key in place
        if: env.BUILD_TYPE == 'release'
        env:
          # base64 of a .tar.gz holding companion-release.jks and release.properties
          RELEASE_BUNDLE: ${{ secrets.ANDROID_RELEASE_BUNDLE }}
        run: |
          if [ -z "$RELEASE_BUNDLE" ]; then
            echo "::error::The ANDROID_RELEASE_BUNDLE secret is missing. Not building an unsigned or differently signed release (use release-unsigned for that)."
            exit 1
          fi
          echo "$RELEASE_BUNDLE" | base64 -d | tar -xz -C apps/web/android/keystore companion-release.jks release.properties

      - name: Build the APK and run the Android unit tests
        working-directory: apps/web/android
        run: |
          task=$([ "$BUILD_TYPE" = debug ] && echo assembleDebug || echo assembleRelease)
          ./gradlew --no-daemon "$task" testDebugUnitTest

      - name: Remove the release key
        if: always()
        run: rm -f apps/web/android/keystore/companion-release.jks apps/web/android/keystore/release.properties

      - name: Verify the APK
        id: verify
        run: |
          set -euo pipefail
          name=$(node -p "require('./apps/web/version.json').name")
          code=$(node -p "require('./apps/web/version.json').code")
          dir=$([ "$BUILD_TYPE" = debug ] && echo debug || echo release)
          src=$(ls apps/web/android/app/build/outputs/apk/"$dir"/*.apk 2>/dev/null | head -n 1 || true)
          [ -n "$src" ] && [ -s "$src" ] || { echo "::error::No $BUILD_TYPE APK was produced"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          [ "$BUILD_TYPE" = debug ] && id=app.detoxcompanion.test || id=app.detoxcompanion

          badging=$("$bt/aapt2" dump badging "$src")
          first=$(printf '%s\n' "$badging" | sed -n 1p)
          echo "$first"
          printf '%s\n' "$first" | grep -q "name='$id' versionCode='$code' versionName='$name'" \
            || { echo "::error::Package or version doesn't match version.json ($id $code $name)"; exit 1; }
          debuggable=$(printf '%s\n' "$badging" | grep -c application-debuggable || true)
          if [ "$BUILD_TYPE" != debug ] && [ "$debuggable" != 0 ]; then echo "::error::Release APK is debuggable"; exit 1; fi

          web=$(unzip -p "$src" 'assets/public/assets/*.js' | grep -o 'name:"[0-9.]*",code:[0-9]*' | sort -u)
          [ "$web" = "name:\"$name\",code:$code" ] \
            || { echo "::error::The web bundle inside the APK reports $web, not $name / $code"; exit 1; }

          if [ "$BUILD_TYPE" = release-unsigned ]; then
            if "$bt/apksigner" verify "$src" >/dev/null 2>&1; then echo "::error::Expected an unsigned APK"; exit 1; fi
            cert="none (unsigned: sign it with the release key before use)"
          else
            "$bt/apksigner" verify --verbose --print-certs "$src" | tee signature.txt
            # "Signer #1 certificate SHA-256 digest: …" or, on newer build tools, "V2 Signer: certificate SHA-256 digest: …"
            cert=$(grep -m1 -E "certificate SHA-256 digest: [0-9a-f]{64}" signature.txt | awk '{print $NF}')
            [ -n "$cert" ] || { echo "::error::Couldn't read the signing certificate"; exit 1; }
            if [ "$BUILD_TYPE" = release ] && [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::Signed with certificate $cert, not the release key"; exit 1
            fi
          fi

          out="Pawse-$name-$code-$BUILD_TYPE-${COMMIT_SHA::7}.apk"
          mkdir -p out && cp "$src" "out/$out"
          sha=$(sha256sum "out/$out" | cut -d' ' -f1)
          {
            echo "File: $out"
            echo "App: $id"
            echo "Version: $name (code $code)"
            echo "Build type: $BUILD_TYPE$([ "$BUILD_TYPE" = debug ] && echo ' (test only, never publish)')$([ "$BUILD_TYPE" = release-unsigned ] && echo ' (must be signed before use)')"
            echo "Commit: $COMMIT_SHA"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ) by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Signing certificate SHA-256: $cert"
            echo "Debuggable: $([ "$debuggable" = 0 ] && echo no || echo yes)"
            echo "SHA-256: $sha"
            echo "Size: $(stat -c %s "out/$out") bytes"
            echo "Tests (schema, engine, web): $(paste -sd ' ' test-summary.txt); Android unit tests passed"
          } | tee out/BUILD-INFO.txt
          echo "artifact=${out%.apk}" >> "$GITHUB_OUTPUT"
          cat out/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: ${{ steps.verify.outputs.artifact }}
          path: out/
          retention-days: 30
          if-no-files-found: error

      - name: Confirm the APK is downloadable
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          [ -n "$ARTIFACT_ID" ] && [ -n "$ARTIFACT_URL" ] || { echo "::error::The APK artifact wasn't uploaded"; exit 1; }
          echo "Download (signed-in GitHub users; a zip with the APK and BUILD-INFO.txt): $ARTIFACT_URL"
          { echo; echo "**Download:** $ARTIFACT_URL"; } >> "$GITHUB_STEP_SUMMARY"

  # Publishes the verified release to jithujsam/pawse-releases main. Manual runs only: a release, from main, with "publish" ticked.
  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' && inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One publish at a time: a second run waits rather than racing this one on pawse-releases main.
    concurrency:
      group: pawse-releases-publish
      cancel-in-progress: false
    steps:
      - name: Check the publishing token
        env:
          TOKEN: ${{ secrets.PAWSE_RELEASES_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::The PAWSE_RELEASES_TOKEN secret is missing. Nothing was published."; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.apk.outputs.artifact }}
          path: build

      - uses: actions/checkout@v4
        with:
          repository: jithujsam/pawse-releases
          token: ${{ secrets.PAWSE_RELEASES_TOKEN }}
          path: releases

      - name: Write the release into the pawse-releases checkout
        env:
          NOTES: ${{ inputs.release_notes }}
        run: python3 .github/scripts/publish-release.py --build-dir build --releases releases --notes "$NOTES"

      - name: Commit and push to pawse-releases main
        working-directory: releases
        run: |
          set -euo pipefail
          name=$(python3 -c 'import json; print(json.load(open("latest.json"))["name"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pawse $name: APK, update manifest and notes (pawse-app ${GITHUB_SHA::7})"
          git push origin HEAD:main

      - name: Confirm pawse-releases serves the new APK
        run: |
          set -euo pipefail
          url=$(python3 -c 'import json; print(json.load(open("releases/latest.json"))["url"])')
          want=$(python3 -c 'import json; print(json.load(open("releases/latest.json"))["sha256"])')
          for try in $(seq 10); do
            got=$(curl -sL "$url?t=$(date +%s)" | sha256sum | cut -d' ' -f1)
            if [ "$got" = "$want" ]; then
              echo "Published: $url ($want)" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error::$url still doesn't serve the published APK. Raw GitHub may be caching; check it again in a few minutes."
          exit 1
