<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://raw.githubusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Companion</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2f4f7; }
      @media (prefers-color-scheme: dark) { html, body { background: #0f1012; } }
      .splash { height: 100%; display: grid; place-items: center; }
      .splash i { width: 56px; height: 56px; border-radius: 50%; background: #c98a4b; opacity: .85; animation: s 1.6s ease-in-out infinite; }
      @keyframes s { 50% { transform: scale(.82); opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .splash i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" aria-label="Loading"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
