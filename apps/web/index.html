<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://raw.githubusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Pawse</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f2f4f7; }
      @media (prefers-color-scheme: dark) { html, body { background: #0f1012; } }

      /* Launch screen: the mark and the name, nothing else. Sits above the app until it is ready, then fades away. */
      #launch { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(90% 60% at 50% 38%, #fffaf3 0%, #f7ece0 46%, #f2f4f7 100%);
        transition: opacity .7s cubic-bezier(.22,.8,.3,1), visibility .7s; }
      #launch.out { opacity: 0; visibility: hidden; }
      .launch-in { display: grid; justify-items: center; gap: 26px; transform: translateY(-4%); }
      .launch-mark { position: relative; width: 116px; height: 116px; }
      .launch-mark::before { content: ""; position: absolute; inset: -46px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(226,115,58,.30), rgba(226,115,58,0)); animation: l-halo 2.6s ease-in-out infinite; }
      .launch-mark img { position: relative; width: 116px; height: 116px; border-radius: 32px; display: block;
        box-shadow: 0 1px 0 rgba(255,255,255,.55) inset, 0 22px 46px -14px rgba(196,92,38,.55), 0 4px 12px rgba(60,30,10,.12);
        animation: l-pop .9s cubic-bezier(.22,.8,.3,1) both; }
      .launch-mark::after { content: ""; position: absolute; inset: 0; border-radius: 32px; pointer-events: none;
        background: linear-gradient(115deg, transparent 38%, rgba(255,255,255,.55) 50%, transparent 62%); background-size: 260% 100%;
        animation: l-sheen 1.5s .55s ease-out both; }
      .launch-name { margin: 0; font: 600 46px/1 "Newsreader Variable", Newsreader, Georgia, "Times New Roman", serif; color: #2a2320;
        letter-spacing: .04em; animation: l-name 1.1s .25s cubic-bezier(.22,.8,.3,1) both; }
      @keyframes l-pop { from { opacity: 0; transform: scale(.78) translateY(10px); } }
      @keyframes l-name { from { opacity: 0; letter-spacing: .3em; transform: translateY(8px); } }
      @keyframes l-halo { 50% { transform: scale(1.12); opacity: .75; } }
      @keyframes l-sheen { from { background-position: 130% 0; } to { background-position: -30% 0; } }
      @media (prefers-color-scheme: dark) {
        #launch { background: radial-gradient(90% 60% at 50% 38%, #2b1d14 0%, #17120f 48%, #0f1012 100%); }
        .launch-name { color: #f4ece3; }
        .launch-mark img { box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 22px 50px -12px rgba(226,115,58,.5), 0 4px 14px rgba(0,0,0,.5); }
      }
      @media (prefers-reduced-motion: reduce) {
        .launch-mark::before, .launch-mark img, .launch-mark::after, .launch-name { animation: none; }
        #launch { transition-duration: .2s; }
      }
    </style>
  </head>
  <body>
    <div id="launch" role="img" aria-label="Pawse"><div class="launch-in"><div class="launch-mark"><img src="./icon-192.png" alt="" width="116" height="116" /></div><h1 class="launch-name">Pawse</h1></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
