<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://raw.githubusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16110e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Pawse</title>
    <style>
      html, body { margin: 0; height: 100%; background: #faf7f2; }
      @media (prefers-color-scheme: dark) { html, body { background: #16110e; } }

      /* Launch screen: the paw alone, beating until the app is ready, then it fades away. */
      #launch { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #faf7f2;
        transition: opacity .7s cubic-bezier(.22,.8,.3,1), visibility .7s; }
      #launch.out { opacity: 0; visibility: hidden; }
      .paw-beat { width: 96px; height: 96px; display: block; animation: paw-beat 1.2s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes paw-beat { 0%, 100% { transform: scale(.9); opacity: .45; } 50% { transform: scale(1); opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        #launch { background: #16110e; }
      }
      @media (prefers-reduced-motion: reduce) {
        .paw-beat { animation: none; }
        #launch { transition-duration: .2s; }
      }
    </style>
  </head>
  <body>
    <div id="launch" role="img" aria-label="Pawse"><img class="paw-beat" src="./logo-mark.svg" alt="" width="96" height="96" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
